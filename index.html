  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,Segoe UI,sans-serif;color:var(--text);

    display:flex;flex-direction:column;min-height:100vh;
  }
  header{padding:18px 20px;text-align:center}
  header h1{margin:0;font-size:1.25rem;letter-spacing:.3px}
  header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
  .wrap{flex:1;display:flex;justify-content:center;padding:0 14px 20px}
  .chat{
    width:100%;max-width:760px;background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid #2a3358;border-radius:20px;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)
  }
  .hero{
    display:flex;gap:16px;align-items:center;padding:18px 20px;
    border-bottom:1px solid #2a3358;background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(56,189,248,.12))
  }
  .avatar{
    width:76px;height:76px;border-radius:50%;flex:0 0 auto;
    border:3px solid var(--accent);background:#0e1430;
    box-shadow:0 0 0 4px rgba(139,92,246,.18),0 8px 20px rgba(0,0,0,.4);
    animation:bob 3.5s ease-in-out infinite
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero .name{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .status-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
  .hero .role{color:var(--muted);font-size:.85rem;margin-top:2px}
  .messages{padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;height:46vh;min-height:280px}
  .row{display:flex;gap:10px;align-items:flex-end;max-width:88%}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .mini{width:30px;height:30px;border-radius:50%;flex:0 0 auto;border:2px solid var(--accent)}
  .bubble{padding:11px 14px;border-radius:14px;line-height:1.5;font-size:.95rem;white-space:pre-wrap}
  .bot .bubble{background:var(--bubble);border-top-left-radius:4px}
  .user .bubble{background:var(--user);border-top-right-radius:4px}
  .bubble a{color:var(--accent2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
  .chip{
    background:#1a2245;border:1px solid #33407a;color:var(--text);
    padding:8px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;transition:.15s
  }
  .chip:hover{background:var(--accent);border-color:var(--accent)}
  .composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid #2a3358}
  .composer input{
    flex:1;padding:12px 14px;border-radius:12px;border:1px solid #33407a;
    background:#0d1330;color:var(--text);font-size:.95rem
  }
  .composer button{
    border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08122a
  }
  .typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;
    background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  footer{text-align:center;color:var(--muted);font-size:.72rem;padding:0 0 16px}
  footer a{color:var(--muted)}

  /* ---- Anime avatar ---- */
  .avatar{overflow:hidden}
  .ariaFace{width:100%;height:100%;display:block}
  .mini-face{width:32px;height:32px;border-radius:50%;flex:0 0 auto;border:2px solid var(--accent);background:#0e1430}
  /* expression defaults (neutral) */
  #eyesHappy,#mouthSmile,#mouthTalk,#mouthO{display:none}
  #mouthNeutral{display:block}
  .blush{opacity:0;transition:opacity .35s}
  .look{transition:transform .35s}
  .brow{transition:transform .3s}
  #eyesOpen{transition:transform .3s}
  .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5.4s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(0)}96.5%{transform:scaleY(1)}}
  /* happy */
  .exp-happy #eyesOpen{display:none}
  .exp-happy #eyesHappy{display:block}
  .exp-happy #mouthNeutral{display:none}
  .exp-happy #mouthSmile{display:block}
  .exp-happy .blush{opacity:.85}
  /* thinking */
  .exp-think .look{transform:translate(2px,-3px)}
  .exp-think .brow{transform:translateY(-3px)}
  .exp-think .blush{opacity:.3}
  /* talking */
  .exp-talk #mouthNeutral{display:none}
  .exp-talk #mouthTalk{display:block}
  .talkmouth{transform-box:fill-box;transform-origin:50% 50%;animation:talk .26s infinite}
  @keyframes talk{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .exp-talk .blush{opacity:.4}
  /* surprised */
  .exp-surprised #mouthNeutral{display:none}
  .exp-surprised #mouthO{display:block}
  .exp-surprised #eyesOpen{transform:scale(1.06)}
  .exp-surprised .brow{transform:translateY(-4px)}
</style>

    { key:'strengths',       words:['strength','strengths','best at','superpower','what is he good','excel at','edge','strong suit'] },
    { key:'contact',         words:['contact','email','reach him','connect','get in touch','message him','how to reach'] },
    { key:'resume',          words:['resume','cv ','curriculum vitae'] },
    { key:'links',           words:['github link','profile link','social','your links','find him online'] },
    { key:'proud',           words:['proud','best project','favorite project','biggest achievement','accomplish','most proud'] },
    { key:'favorite_tech',   words:['favorite tech','favourite','prefer using','love using','enjoy most','favorite tool'] },
    { key:'rag',             words:['rag assistant','retrieval','rag ','document','pdf','knowledge base','grounded answer','cited'] },
    { key:'chat',            words:['real-time chat','realtime','real time','websocket','chat app','live presence','chat project'] },
    { key:'url',             words:['url shortener','shorten','shortener','base62','redirect','short link','short code'] },
    { key:'ml',              words:['ml serving','serving api','model serving','random forest','drift','inference','retrain'] },
    { key:'projects',        words:['project','projects','built','portfolio','apps he','showcase','things he built','what has he made'] },
    { key:'hobby',           words:['hobby','hobbies','free time','for fun','interest','passion','outside work','spare time'] },
    { key:'fun_fact',        words:['fun fact','interesting fact','surprise me','random fact','tell me something','something cool'] },
  ];

  function pick(v){ return Array.isArray(v) ? v[Math.floor(Math.random() * v.length)] : v; }

  function answer(text){
    const q = ' ' + text.toLowerCase().replace(/[^a-z0-9@#+\s-]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    let best = null, bestScore = 0;
    for(const intent of INTENTS){
      let score = 0;
      for(const w of intent.words){
        if(q.includes(w)){
          score += w.includes(' ') ? 3 : (w.length > 5 ? 3 : (w.length > 3 ? 2 : 1));
        }
      }
      if(score > bestScore){ bestScore = score; best = intent.key; }
    }
    if(!best || bestScore === 0) return pick(KB.fallback);
    return pick(KB[best]) || pick(KB.fallback);
  }

  // ---- UI ----
  const messagesEl = document.getElementById('messages');

  function bubble(text, who){
    const row = document.createElement('div');
    row.className = 'row ' + who;
    if(who === 'bot'){
      const holder = document.createElement('div');
      holder.innerHTML = MINI_SVG;
      row.appendChild(holder.firstElementChild);
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = linkify(text);
    row.appendChild(b);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function linkify(t){
    const esc = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function typing(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `${MINI_SVG}<div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function respond(text){
    const t = typing();
    setExpression('think');
    const reply = answer(text);
    setTimeout(()=>{
      t.remove();
      bubble(reply, 'bot');
      setExpression('talk');
      const dur = Math.min(4200, 900 + reply.length * 18);
      clearTimeout(_expTimer);
      setTimeout(()=> setExpression('happy'), dur);
      _expTimer = setTimeout(()=> setExpression('neutral'), dur + 1400);
    }, 620 + Math.random()*420);
  }

  function reactThenRespond(text){
    setExpression('surprised');
    setTimeout(()=> respond(text), 260);
  }

  function handleSend(){
    const input = document.getElementById('input');
    const text = input.value.trim();
    if(!text) return;
    bubble(text, 'user');
    input.value = '';
    reactThenRespond(text);
  }

  function ask(text){ bubble(text,'user'); reactThenRespond(text); }

  // Quick-reply chips
  const CHIPS = [
    ['🧠 Skills','What are his skills?'],
    ['�️ How he works','How does he approach building?'],
    ['🤖 AI & ML','His AI and machine learning skills'],
    ['🚀 Projects','Tell me about his projects'],
    ['💼 Experience','What is his experience?'],
    ['🎯 Strengths','What is he best at?'],
    ['⭐ Why hire him?','Why should I hire him?'],
    ['📧 Contact','How can I contact him?'],
  ];
  const chipsEl = document.getElementById('chips');
  CHIPS.forEach(([label,query])=>{
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = label;
    c.onclick = ()=> ask(query);
    chipsEl.appendChild(c);
  });

  // Greeting
  setTimeout(()=>{
    bubble(pick(KB.intro), 'bot');
    setExpression('happy');
    setTimeout(()=> setExpression('neutral'), 2600);
  }, 300);
</script>
</body>
</html>
