<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aria — Gourav's AI Assistant</title>
<meta name="description" content="Ask Aria anything about Gourav Goyal — skills, projects, and experience." />
<style>
  :root{
    --bg:#0b1020; --bg2:#131a33; --card:#161d38; --accent:#8b5cf6; --accent2:#38bdf8;
    --text:#e7ecf5; --muted:#9aa6c2; --bubble:#1e2647; --user:#6366f1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,Segoe UI,sans-serif;color:var(--text);
    background:radial-gradient(1200px 600px at 80% -10%,#25204a 0,transparent 60%),
               radial-gradient(1000px 500px at -10% 110%,#123047 0,transparent 55%),
               var(--bg);
    display:flex;flex-direction:column;min-height:100vh;
  }
  header{padding:18px 20px;text-align:center}
  header h1{margin:0;font-size:1.25rem;letter-spacing:.3px}
  header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
  .wrap{flex:1;display:flex;justify-content:center;padding:0 14px 20px}
  .chat{
    width:100%;max-width:760px;background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid #2a3358;border-radius:20px;display:flex;flex-direction:column;
    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)
  }
  .hero{
    display:flex;gap:16px;align-items:center;padding:18px 20px;
    border-bottom:1px solid #2a3358;background:linear-gradient(90deg,rgba(139,92,246,.18),rgba(56,189,248,.12))
  }
  .avatar{
    width:76px;height:76px;border-radius:50%;flex:0 0 auto;
    border:3px solid var(--accent);background:#0e1430;
    box-shadow:0 0 0 4px rgba(139,92,246,.18),0 8px 20px rgba(0,0,0,.4);
    animation:bob 3.5s ease-in-out infinite
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .hero .name{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
  .status-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
  .hero .role{color:var(--muted);font-size:.85rem;margin-top:2px}
  .messages{padding:18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;height:46vh;min-height:280px}
  .row{display:flex;gap:10px;align-items:flex-end;max-width:88%}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .mini{width:30px;height:30px;border-radius:50%;flex:0 0 auto;border:2px solid var(--accent)}
  .bubble{padding:11px 14px;border-radius:14px;line-height:1.5;font-size:.95rem;white-space:pre-wrap}
  .bot .bubble{background:var(--bubble);border-top-left-radius:4px}
  .user .bubble{background:var(--user);border-top-right-radius:4px}
  .bubble a{color:var(--accent2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
  .chip{
    background:#1a2245;border:1px solid #33407a;color:var(--text);
    padding:8px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;transition:.15s
  }
  .chip:hover{background:var(--accent);border-color:var(--accent)}
  .composer{display:flex;gap:10px;padding:14px 16px;border-top:1px solid #2a3358}
  .composer input{
    flex:1;padding:12px 14px;border-radius:12px;border:1px solid #33407a;
    background:#0d1330;color:var(--text);font-size:.95rem
  }
  .composer button{
    border:0;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#08122a
  }
  .typing span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;
    background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  footer{text-align:center;color:var(--muted);font-size:.72rem;padding:0 0 16px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
  <header>
    <h1>💬 Meet Aria</h1>
    <p>Gourav Goyal's AI assistant — ask me about his skills, projects & experience.</p>
  </header>

  <div class="wrap">
    <div class="chat">
      <div class="hero">
        <img class="avatar" id="avatar" alt="Aria avatar" />
        <div>
          <div class="name">Aria <span class="status-dot"></span></div>
          <div class="role">AI Portfolio Assistant · online</div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="chips" id="chips"></div>

      <div class="composer">
        <input id="input" placeholder="Ask me anything about Gourav…" autocomplete="off"
               onkeydown="if(event.key==='Enter')handleSend()" />
        <button onclick="handleSend()">Send</button>
      </div>
    </div>
  </div>

  <footer>
    Avatar by <a href="https://www.dicebear.com" target="_blank" rel="noopener">DiceBear</a> (Lorelei, CC BY 4.0) ·
    Built by <a href="https://github.com/Gextro" target="_blank" rel="noopener">Gextro</a>
  </footer>

<script>
  // ---- Avatars (license-free, generated) ----
  const ARIA_AVATAR = "https://api.dicebear.com/9.x/lorelei/svg?seed=Aria&backgroundColor=b6e3f4,c0aede,ffd5dc";
  document.getElementById('avatar').src = ARIA_AVATAR;

  // ---- Knowledge base about Gourav ----
  const KB = {
    intro: "Hi! I'm Aria 🌸 — Gourav's AI assistant. I can tell you about his skills, his four live-deployed projects, his experience, or how to reach him. What would you like to know?",
    skills: "Gourav's core stack:\n• Languages: Python, TypeScript, JavaScript\n• Backend & AI: FastAPI, Node.js, Express, scikit-learn, WebSockets\n• Frontend: React, Tailwind CSS, HTML/CSS\n• Tooling & DevOps: Docker, Git, Render\nHe pairs these with testing, monitoring, and clean architecture.",
    experience: "Gourav is a Software & AI Engineer. He worked as a Frontend Developer Intern at Solyn Software (HTML, CSS, performance optimization), and has since built and deployed four full backend/AI systems end-to-end.",
    education: "Gourav is focused on practical, production-grade engineering — currently deepening system design and distributed systems while shipping real projects.",
    contact: "You can reach Gourav at 📧 gorav76600@gmail.com or on GitHub: https://github.com/Gextro",
    why: "Why hire Gourav? He doesn't just write code — he ships. Every one of his four projects is live, Dockerized, unit-tested, and monitored. He builds AI (RAG, LLM assistants), real-time systems (WebSockets), and ML serving with production concerns baked in. That end-to-end ownership is exactly what strong SDE/AI teams need.",
    projects: "Gourav has 4 live, deployed projects:\n\n1. 🤖 AI RAG Assistant — chat with your documents (cited answers)\n2. 💬 Real-Time Chat + AI — WebSocket chat with an @ai assistant\n3. 🔗 URL Shortener — base62 links, rate limiting, analytics\n4. 📊 ML Serving API — model serving with drift monitoring\n\nAsk me about any one of them for details!",
    rag: "🤖 AI RAG Assistant — a Retrieval-Augmented Generation app: upload documents, then ask questions and get answers grounded in and cited from those documents. Built with Python, FastAPI, and scikit-learn; features deterministic local retrieval, a persistent knowledge base, and a provider-flexible LLM.\nLive: https://ai-rag-assistant-3gsl.onrender.com\nCode: https://github.com/Gextro/ai-rag-assistant",
    chat: "💬 Real-Time Chat + AI — a WebSocket chat with rooms, live presence, and message history, plus an in-chat AI assistant you summon with @ai. Built in TypeScript on Node.js with the ws library.\nLive: https://realtime-chat-rdcf.onrender.com\nCode: https://github.com/Gextro/realtime-chat",
    url: "🔗 URL Shortener — turns long links into base62 short codes with rate limiting, click analytics, and idempotent creation. Built in TypeScript with Express and fully tested with Jest.\nLive: https://url-shortener-85o7.onrender.com\nCode: https://github.com/Gextro/url-shortener",
    ml: "📊 ML Serving API — serves a trained RandomForest model with train/predict/retrain endpoints and live metrics including p95 latency and prediction drift monitoring. Built with Python, FastAPI, and scikit-learn.\nLive: https://ml-serving-api.onrender.com\nCode: https://github.com/Gextro/ml-serving-api",
    hobby: "Beyond shipping code, Gourav is always learning — system design, distributed systems, and new tools like Next.js. He enjoys turning rough ideas into polished, deployed products.",
    thanks: "You're very welcome! 💜 Anything else you'd like to know about Gourav?",
    hello: "Hello! 👋 I'm Aria. Ask me about Gourav's skills, projects, experience, or how to contact him.",
    fallback: "I'm not totally sure about that one 🤔 — but I can tell you about Gourav's skills, his 4 projects (RAG, real-time chat, URL shortener, ML serving), his experience, or his contact info. Try one of the chips below!"
  };

  // ---- Intent matching (keyword scoring) ----
  const INTENTS = [
    { key:'hello',      words:['hi','hello','hey','yo','hola','sup','greetings'] },
    { key:'thanks',     words:['thanks','thank you','thx','appreciate','cool','awesome','nice'] },
    { key:'skills',     words:['skill','stack','tech','technolog','language','know','tools','framework','expertise','good at'] },
    { key:'experience', words:['experience','work','intern','job','company','solyn','career','background'] },
    { key:'education',  words:['education','study','degree','college','university','school','learn'] },
    { key:'contact',    words:['contact','email','reach','hire me','connect','linkedin','mail','get in touch'] },
    { key:'why',        words:['why','hire','recruit','strength','stand out','best','fit','choose'] },
    { key:'rag',        words:['rag','retrieval','document','doc','pdf','knowledge','chat with','ai assistant project'] },
    { key:'chat',       words:['realtime','real-time','websocket','chat','presence','room','socket'] },
    { key:'url',        words:['url','shorten','link','base62','redirect','short'] },
    { key:'ml',         words:['ml','model','serving','random forest','drift','predict','machine learning','iris','metric'] },
    { key:'projects',   words:['project','portfolio','built','build','app','made','work on','showcase'] },
    { key:'hobby',      words:['hobby','fun','interest','free time','passion','outside'] },
  ];

  function answer(text){
    const q = ' ' + text.toLowerCase().trim() + ' ';
    let best = null, bestScore = 0;
    for(const intent of INTENTS){
      let score = 0;
      for(const w of intent.words){ if(q.includes(w)) score += w.length > 4 ? 2 : 1; }
      if(score > bestScore){ bestScore = score; best = intent.key; }
    }
    if(!best || bestScore === 0) return KB.fallback;
    return KB[best] || KB.fallback;
  }

  // ---- UI ----
  const messagesEl = document.getElementById('messages');
  const MINI = "https://api.dicebear.com/9.x/lorelei/svg?seed=Aria&backgroundColor=c0aede";

  function bubble(text, who){
    const row = document.createElement('div');
    row.className = 'row ' + who;
    if(who === 'bot'){
      const img = document.createElement('img');
      img.className = 'mini'; img.src = MINI; img.alt = 'Aria';
      row.appendChild(img);
    }
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = linkify(text);
    row.appendChild(b);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function linkify(t){
    const esc = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  }

  function typing(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<img class="mini" src="${MINI}" alt="Aria"/><div class="bubble typing"><span></span><span></span><span></span></div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function respond(text){
    const t = typing();
    const reply = answer(text);
    setTimeout(()=>{ t.remove(); bubble(reply, 'bot'); }, 550 + Math.random()*400);
  }

  function handleSend(){
    const input = document.getElementById('input');
    const text = input.value.trim();
    if(!text) return;
    bubble(text, 'user');
    input.value = '';
    respond(text);
  }

  function ask(text){ bubble(text,'user'); respond(text); }

  // Quick-reply chips
  const CHIPS = [
    ['🧠 Skills','What are his skills?'],
    ['🚀 Projects','Tell me about his projects'],
    ['💼 Experience','What is his experience?'],
    ['🤖 RAG project','Explain the RAG assistant'],
    ['💬 Chat project','Explain the real-time chat'],
    ['📊 ML project','Explain the ML serving API'],
    ['⭐ Why hire him?','Why should I hire him?'],
    ['📧 Contact','How can I contact him?'],
  ];
  const chipsEl = document.getElementById('chips');
  CHIPS.forEach(([label,query])=>{
    const c = document.createElement('div');
    c.className = 'chip'; c.textContent = label;
    c.onclick = ()=> ask(query);
    chipsEl.appendChild(c);
  });

  // Greeting
  setTimeout(()=> bubble(KB.intro, 'bot'), 300);
</script>
</body>
</html>
